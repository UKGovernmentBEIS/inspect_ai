\* Same constants and checks in ExecRemote.cfg and buggy/ExecRemote.cfg.
\* BufCap = MaxOut: the job buffer never fills (see INVARIANTS.md, F2).
CONSTANTS
    Killers = {k1, k2}
    MaxOut = 2
    MaxStdin = 1
    MaxRetry = 2
    MaxFail = 1
    BufCap = 2
    KeyedKillAnyTime = FALSE

SPECIFICATION Spec

INVARIANTS
    TypeOK
    NoPollAfterLocalStop
    NoMissingJobRetryAfterStop
    IteratorNeverFails
    IteratorEndsDrained
    IteratorStoppedAfterRpc
    KillReturnJoinsStop
    StopNeverAbandoned
    TerminalPollAfterTermination
    RetireOnlyAfterTermination
    ReadersCutOnlyAfterExit
    NoGuestOutputLoss
    OutputConserved
    KeyStepsLegal
    KillKeySettles
    KillKeyJoinsTermination
    SeqMonotonic
    NoDuplicateEvent
    OutputSequenceMonotone
    NoEventLoss
    CompletedDeliversAll
