# Moonshot AI Model Database
#
# Hand-maintained entries for Moonshot AI models served via the moonshot
# provider or gateway hosting providers (e.g. cloudflare/moonshotai/kimi-k3).
# Models curated here are excluded from the auto-generated together.yml
# (sync_models.py skips case-normalized lookup-key collisions) so these
# entries always win lookups.

moonshotai:
  display_name: Moonshot AI
  models:
    kimi-k3.1-pro:
      display_name: "Kimi K3.1 Pro"
      # Release date and knowledge cutoff not stated in Moonshot's docs; omit for now.
      context_length: 1048576
      # Default output cap is 131072 but it is settable up to the full 1M window.
      output_tokens: 1048576
      reasoning: True
      # Thinking is always on; reasoning_effort accepts low/high/max (default max).
      # https://platform.kimi.ai/docs/guide/kimi-k3-1-pro-quickstart
      reasoning_effort_default: max
    kimi-k3.1-pro-highspeed:
      # Same model as kimi-k3.1-pro with identical limits, served at 2-3x the speed.
      display_name: "Kimi K3.1 Pro Highspeed"
      context_length: 1048576
      output_tokens: 1048576
      reasoning: True
      reasoning_effort_default: max
    kimi-k3:
      display_name: "Kimi K3"
      release_date: 2026-07-16
      # Knowledge cutoff undisclosed (no model card published yet); omit for now.
      context_length: 1048576
      # Default output cap is 131072 but it is settable up to the full 1M window.
      output_tokens: 1048576
      reasoning: True
      # Thinking is always on; reasoning_effort accepts low/high/max (default max).
      # https://platform.kimi.ai/docs/api/models-overview
      reasoning_effort_default: max
    kimi-k2.6:
      display_name: "Kimi K2.6"
      context_length: 262144
    kimi-k2.5:
      display_name: "Kimi K2.5"
      context_length: 262144
