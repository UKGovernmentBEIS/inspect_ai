DeepSeek:
  display_name: DeepSeek
  models:
    # V4.1 Flash is the current Flash model and the only DeepSeek model that
    # accepts image input. https://api-docs.deepseek.com/quick_start/pricing
    deepseek-flash:
      display_name: "V4.1 Flash"
      release_date: 2026-09-10
      context_length: 1048576
      output_tokens: 393216
      reasoning: True
      # Thinking is on by default; effort scale is low/high/max with a
      # default of high. https://api-docs.deepseek.com/guides/thinking_mode
      reasoning_effort_default: high
    # The 2026-09-10 announcement that deepseek-v4-pro requests would route to
    # V4.1 Flash from 2026-09-14 was withdrawn: the changelog says V4 Pro
    # service continues with billing unchanged, and the API still reports
    # model "deepseek-v4-pro" for these requests.
    deepseek-v4-pro:
      display_name: "V4 Pro"
      release_date: 2026-04-24
      context_length: 1048576
      output_tokens: 393216
      reasoning: True
      reasoning_effort_default: high
    # deepseek-v4-flash (and the experimental deepseek-v4-flash-vision-exp,
    # released 2026-08-21) were retired on 2026-09-10. Both names are still
    # accepted but requests are served by deepseek-flash (V4.1 Flash) at
    # Flash pricing, so logs dated after 2026-09-10 that name these models
    # reflect V4.1 Flash. Entries retained for historical log analysis.
    # https://api-docs.deepseek.com/updates/
    deepseek-v4-flash:
      display_name: "V4 Flash"
      release_date: 2026-04-24
      context_length: 1048576
      output_tokens: 393216
      reasoning: True
      reasoning_effort_default: high
      versions:
        DeepSeek-V4-Flash-0731:
          release_date: 2026-07-31
          snapshot: "0731"
    # deepseek-chat and deepseek-reasoner were retired from the DeepSeek API
    # on 2026-07-24 (requests were routed to deepseek-v4-flash during the
    # transition window). Entries retained for historical log analysis.
    deepseek-chat:
      display_name: "V3"
      release_date: 2024-12-26
      knowledge_cutoff_date: 2024-07-01
      context_length: 65536
      versions:
        DeepSeek-V3-0324:
          release_date: 2025-03-24
          snapshot: "0324"
    deepseek-reasoner:
      display_name: "R1"
      release_date: 2025-02-17
      context_length: 65536
      reasoning: True
      # DeepSeek-R1 has no `reasoning_effort` scale: thinking is always on.
      # https://api-docs.deepseek.com/guides/reasoning_model
      reasoning_effort_default: fixed
      versions:
        DeepSeek-R1-0528:
          release_date: 2025-05-28
          snapshot: "0528"
