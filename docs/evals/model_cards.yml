# Benchmarks referenced in recent model cards/announcements.
# Each entry is a list of eval IDs (from evals.json) that appeared.
# Evals get a `model_cards` array field (e.g., ["claude", "chatgpt", "gemini"]).
# When a benchmark exists in both inspect_evals and harbor, prefer the
# inspect_evals ID (don't list the harbor duplicate).
#
# IDs must match evals.json exactly. Nothing validates them, so an ID that
# goes stale after an evals/harbor sync silently stops upweighting its eval
# rather than erroring — re-check this file whenever eval IDs change.

