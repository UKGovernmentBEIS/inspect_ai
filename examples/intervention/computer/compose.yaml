services:
  default:
    image: aisiuk/inspect-computer-tool
    init: true
    # Internet access is intentional for this general-purpose agent, and
    # container networking is also required for the VNC port mappings.
    # Dynamically assign loopback host ports for vnc and novnc
    ports:
      - "127.0.0.1::5900"
      - "127.0.0.1::6080"
