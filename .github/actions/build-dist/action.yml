name: Build inspect_ai distributions
description: >-
  Download and digest-gate the sandbox tools, build the sdist and wheel, and
  check their version and contents. Shared by the publish and parity
  workflows so both build the same way. Runs this action's revision of
  scripts/pypi-release.py against the tree in `source`.

inputs:
  version:
    description: Version the build must produce (the release tag)
    required: true
  source:
    description: Checkout to build, with full history, tags and submodules
    required: false
    default: "."

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.11"

    # The build frontend and backend come from requirements.txt, pinned with
    # hashes. The build below runs without isolation, so nothing else is
    # resolved at build time. Dependabot updates the file weekly with a 7-day
    # cooldown. To update it by hand, run in this directory (or use
    # --upgrade-package <pkg> for one tool):
    #   uv pip compile --no-config --generate-hashes --python-version 3.11 \
    #     --python-platform x86_64-unknown-linux-gnu --exclude-newer "7 days" \
    #     --only-binary :all: --upgrade requirements.in -o requirements.txt
    - name: Install build toolchain
      shell: bash
      env:
        REQUIREMENTS: ${{ github.action_path }}/requirements.txt
      run: |
        python -m pip install --require-hashes --only-binary :all: --no-deps -r "$REQUIREMENTS"

    - name: Download and verify sandbox tools
      shell: bash
      working-directory: ${{ inputs.source }}
      env:
        RELEASE_SCRIPT: ${{ github.action_path }}/../../../scripts/pypi-release.py
      run: python "$RELEASE_SCRIPT" prepare

    - name: Build
      shell: bash
      working-directory: ${{ inputs.source }}
      run: python -m build --no-isolation

    - name: Verify distributions
      shell: bash
      working-directory: ${{ inputs.source }}
      env:
        RELEASE_SCRIPT: ${{ github.action_path }}/../../../scripts/pypi-release.py
        VERSION: ${{ inputs.version }}
      run: python "$RELEASE_SCRIPT" verify-dist "$VERSION"
