name: Build sandbox tools binaries
run-name: Build sandbox tools at ${{ inputs.sha }}

# Builds the four non-dev inspect-sandbox-tools binaries (amd64/arm64 x
# glibc/musl) of the version in sandbox_tools_version.txt at `sha`, the
# approved head commit of a version-bump PR. The PR may come from a fork: its
# commits are fetchable by SHA here, and only maintainers can dispatch. The
# run title names the commit, and the attestation names this run, which is how
# scripts/release-sandbox-tools.sh ties the binaries to the commit before it
# uploads them (see src/inspect_sandbox_tools/design/RELEASING.md). Nothing
# here holds AWS credentials or publishes.
on:
  workflow_dispatch:
    inputs:
      sha:
        description: Full commit SHA to build (the PR's approved head)
        required: true
        type: string

permissions:
  contents: read

env:
  # See build.yml.
  UV_VERSION: 0.13.5

jobs:
  # Only build inputs run before the attest job signs: this job runs the
  # build scripts with the runner's stdlib python3 (no project install, no
  # dependencies on the host) and Docker builds from the pinned Dockerfiles and
  # lockfiles. Validation, which imports all of inspect_ai, runs after signing,
  # so anything it changed would fail attestation verification. The build runs
  # PyPI and conda-forge code, so it holds no token beyond contents: read; only
  # the attest job can sign. No job restores a cache.
  build:
    name: Build ${{ matrix.arch }} ${{ matrix.libc }}
    strategy:
      fail-fast: false
      matrix: &variants
        arch: [amd64, arm64]
        libc: [glibc, musl]
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false

      - name: Check the checkout is the requested commit
        env:
          SHA: ${{ inputs.sha }}
        run: |
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::sha must be a full 40-character commit SHA"; exit 1; }
          [ "$(git rev-parse HEAD)" = "$SHA" ]

      - name: Build
        env:
          DOCKER_BUILDKIT: 1
          BUILDKIT_PROGRESS: plain
          MUSL: ${{ matrix.libc == 'musl' && '--musl' || '' }}
        run: python3 src/inspect_ai/tool/_sandbox_tools_utils/build_within_container.py --arch ${{ matrix.arch }} $MUSL --dev=false

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-${{ matrix.arch }}-${{ matrix.libc }}
          path: src/inspect_ai/binaries/inspect-sandbox-tools-*
          if-no-files-found: error
          retention-days: 7

  attest:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
          sparse-checkout: src/inspect_ai/tool/_sandbox_tools_utils/sandbox_tools_version.txt
          sparse-checkout-cone-mode: false

      # By exact name: a pattern would also pick up any other artifact in the run.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-amd64-glibc
          path: binaries
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-amd64-musl
          path: binaries
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-arm64-glibc
          path: binaries
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-arm64-musl
          path: binaries

      # Same format and order as upload_to_s3.py writes.
      - name: Check artifacts and write SHA256SUMS
        id: sums
        working-directory: binaries
        env:
          LC_ALL: C
        run: |
          VERSION=$(tr -d '[:space:]' < ../src/inspect_ai/tool/_sandbox_tools_utils/sandbox_tools_version.txt)
          EXPECTED=$(printf 'inspect-sandbox-tools-%s-v%s\n' amd64 "$VERSION" amd64-musl "$VERSION" arm64 "$VERSION" arm64-musl "$VERSION" | sort)
          ACTUAL=$(ls | sort)
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::Expected exactly:"$'\n'"$EXPECTED"$'\n'"Got:"$'\n'"$ACTUAL"
            exit 1
          fi
          sha256sum $EXPECTED > SHA256SUMS
          cat SHA256SUMS
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: binaries/SHA256SUMS

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sandbox-tools-v${{ steps.sums.outputs.version }}
          path: binaries/
          if-no-files-found: error

  # Each signed artifact on its own arch's runner. The release takes binaries
  # only from a run that succeeded, so validation still gates it.
  validate:
    name: Validate ${{ matrix.arch }} ${{ matrix.libc }}
    needs: attest
    strategy:
      fail-fast: false
      matrix: *variants
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.11"
          enable-cache: false

      - name: Install dependencies
        run: uv sync --locked

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-${{ matrix.arch }}-${{ matrix.libc }}
          path: src/inspect_ai/binaries

      - name: Validate across distros
        run: uv run --locked python -m inspect_ai.tool._sandbox_tools_utils.validate_distros
