# Suppression ledger gate — see .github/scripts/check_suppressions.py and
# the "Suppression gate" section in AGENTS.md. Enforcement only: it runs
# fine with the read-only token fork PRs get. The PR delta comment is
# posted by suppressions-comment.yml (pull_request_target), which needs a
# write token — keep the two concerns in their separate workflows.
name: Suppressions

on:
  push:
    branches:
      - main
      - "release/**"
  pull_request:
    branches:
      - main
      - "release/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  UV_VERSION: 0.13.5

jobs:
  suppressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # python-version pins the interpreter `uv run` uses (downloading it if
      # the runner lacks it) rather than the runner image's, which changes
      # with image updates. No cache: this job installs no packages, and
      # saving its near-empty cache would take the key build.yml's 3.11 jobs
      # restore.
      - name: Install uv
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.11"
          enable-cache: false

      # The gate is stdlib-only by design: --no-project runs it without the
      # project, so no packages are resolved or installed. Its tests
      # (tests/test_check_suppressions.py) run in build.yml's test job.
      - name: Check suppressions ledger
        run: uv run --no-project .github/scripts/check_suppressions.py
