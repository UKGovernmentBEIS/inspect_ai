# Suppression ledger gate — see .github/scripts/check_suppressions.py and
# the "Suppression gate" section in AGENTS.md. Enforcement only: it runs
# fine with the read-only token fork PRs get. The PR delta comment is
# posted by suppressions-comment.yml (pull_request_target), which needs a
# write token — keep the two concerns in their separate workflows.
name: Suppressions

on:
  push:
    branches:
      - main
      - "release/**"
  pull_request:
    branches:
      - main
      - "release/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  suppressions:
    runs-on: ubuntu-latest
    # No Actions cache use, so the Actions cache refuses any write a malicious
    # package could attempt with the Actions cache token.
    cache-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # python-version pins the interpreter `uv run` uses (downloading it if
      # the runner lacks it) rather than the runner image's, which changes
      # with image updates. actions-cache none: this job installs no packages,
      # and saving its near-empty cache would take the key build.yml's 3.11
      # jobs restore.
      - name: Install uv
        uses: meridianlabs-ai/actions/setup-uv@330f3df6492418d6b25dc2631fc31143489f4674 # main, 2026-11-02
        with:
          python-version: "3.11"
          actions-cache: none

      # The gate is stdlib-only by design: --no-project runs it without the
      # project, so no packages are resolved or installed. Its tests
      # (tests/test_check_suppressions.py) run in build.yml's test job.
      - name: Check suppressions ledger
        run: uv run --no-project .github/scripts/check_suppressions.py
