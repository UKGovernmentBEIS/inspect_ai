name: Publish React Viewer Lib

# Normal releases: release.yml calls this workflow after Release Please
# creates the release (a release created with GITHUB_TOKEN triggers no other
# workflows). A release published by a person (break-glass) triggers it
# directly, as it does publish.yml. npm's trusted publisher is matched against
# the calling workflow, so release.yml and this file each need one.
on:
  release:
    types: [published]
  workflow_call:
    inputs:
      tag:
        description: "Release tag to publish"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Run in dry-run mode (don't actually publish)"
        required: false
        type: boolean
        default: true
      prerelease:
        description: "Publish as pre-release (beta)"
        required: false
        type: boolean
        default: false

jobs:
  publish:
    name: Publish to NPM
    # publish.yml likewise refuses pre-release GitHub Releases.
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    environment: npm
    defaults:
      run:
        working-directory: src/inspect_ai/_view/ts-mono/apps/inspect
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # empty (the triggering ref) except when called from release.yml
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          submodules: recursive

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: src/inspect_ai/_view/ts-mono/package.json

      # Release builds resolve every dependency from the lockfile and the
      # registry; they never restore or save a shared dependency cache.
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.x"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Upgrade npm (for Trusted Publishing)
        run: |
          # Install via prefix to avoid npm self-upgrade rebuild bug on Node 22.
          npm install --prefix "$RUNNER_TEMP/npm-upgrade" --no-audit --no-fund npm@^11.5.1
          echo "$RUNNER_TEMP/npm-upgrade/node_modules/.bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/npm-upgrade/node_modules/.bin/npm" --version

      - name: Install dependencies
        working-directory: src/inspect_ai/_view/ts-mono
        run: pnpm install --frozen-lockfile

      # Must run before publish: the submodule has no tags, so we resolve
      # the version from the parent repo and write it into package.json.
      # prepublishOnly in package.json expects this has already been done.
      - name: Sync version from git tag
        run: |
          VERSION=$(git -C ${{ github.workspace }} describe --tags --abbrev=0 --match='[0-9]*.[0-9]*.[0-9]*')
          npm version "$VERSION" --no-git-tag-version

      - name: Bump to prerelease version
        if: ${{ inputs.prerelease }}
        run: |
          TIMESTAMP=$(date +%s)
          npm version patch --no-git-tag-version
          NEW_VERSION=$(node -p "require('./package.json').version")
          npm version "${NEW_VERSION}-beta.${TIMESTAMP}" --no-git-tag-version

      # check-all and build:lib run tsc and vite-plugin-dts directly, not
      # through turbo, so turbo's generate:css dependency never fires here.
      # The *.module.css.d.ts typings are gitignored, and the viewer
      # type-checks its workspace dependencies' sources too, hence `...`.
      - name: Generate CSS module typings
        working-directory: src/inspect_ai/_view/ts-mono
        run: pnpm --filter '@meridianlabs/log-viewer...' --fail-if-no-match run generate:css

      - name: Run quality checks
        working-directory: src/inspect_ai/_view/ts-mono
        run: pnpm --filter @meridianlabs/log-viewer --fail-if-no-match check-all

      - name: Build library for prerelease
        if: ${{ inputs.prerelease }}
        working-directory: src/inspect_ai/_view/ts-mono
        run: pnpm --filter @meridianlabs/log-viewer --fail-if-no-match build:lib

      - name: Publish to NPM (dry-run)
        if: ${{ inputs.dry-run }}
        run: npm publish --dry-run --access public ${{ inputs.prerelease && '--tag beta --ignore-scripts' || '' }}

      # npm never accepts a version twice, so a retried release skips the
      # publish once the version exists.
      - name: Check npm for this version
        id: npm-version
        if: ${{ !inputs.dry-run && !inputs.prerelease }}
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if [ -n "$(npm view "$NAME@$VERSION" version 2>/dev/null)" ]; then
            echo "::notice::$NAME@$VERSION is already on npm; not publishing it again"
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to NPM
        if: ${{ !inputs.dry-run && steps.npm-version.outputs.published != 'true' }}
        run: npm publish --access public ${{ inputs.prerelease && '--tag beta --ignore-scripts' || '' }}
