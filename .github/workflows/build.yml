name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - "release/**"
  workflow_dispatch:

# Cancel superseded in-flight runs when a PR branch is updated; runs on
# main queue rather than cancel so every merge commit gets a full build.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Needs >= 0.13.4, which drops the compromised emSign root from uv's
  # certificate store (GHSA-hq85-5cpj-mr62), and >= 0.11.24 for relative
  # `exclude-newer` in pyproject.toml (with a stable uv.lock).
  UV_VERSION: 0.13.5

jobs:
  # Keep these check names present on Markdown-only PRs while avoiding source
  # checkout, dependency installation, and code checks. Pushes and manual runs
  # still run the full jobs. Match the filter used by the test matrix below.
  ruff:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        if: github.event_name == 'pull_request'
        id: filter
        with:
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!docs/**'
              - '!design/**'
              - '!**/*.md'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name != 'pull_request' || steps.filter.outputs.code == 'true'
        with:
          fetch-depth: 0
          fetch-tags: true
          # blob:none: all refs/commits for setuptools_scm, no historical
          # file contents (the full pack is ~400MB and fetch time is erratic)
          filter: "blob:none"
      - name: Lint with Ruff
        if: github.event_name != 'pull_request' || steps.filter.outputs.code == 'true'
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          version-file: requirements-dev.txt
      - name: Format with Ruff
        if: github.event_name != 'pull_request' || steps.filter.outputs.code == 'true'
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          version-file: requirements-dev.txt
          args: "format --check"

  mypy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    strategy:
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        if: github.event_name == 'pull_request'
        id: filter
        with:
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!docs/**'
              - '!design/**'
              - '!**/*.md'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name != 'pull_request' || steps.filter.outputs.code == 'true'
        with:
          fetch-depth: 0
          fetch-tags: true
          filter: "blob:none"

      - name: Install uv
        if: github.event_name != 'pull_request' || steps.filter.outputs.code == 'true'
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ matrix.python-version }}

      # `uv sync` rather than `uv venv` + `uv pip install .[dev]`: the step
      # below runs under `uv run`, which syncs the project environment to
      # uv.lock before it executes anything, so an unlocked `uv pip install`
      # is partly undone a step later. Installing the locked set here and
      # passing --no-sync below reaches the same environment once. --locked
      # fails on a uv.lock that is out of date with pyproject.toml instead of
      # re-resolving it.
      - name: Install dependencies
        if: github.event_name != 'pull_request' || steps.filter.outputs.code == 'true'
        run: uv sync --locked

      - name: Run mypy
        if: github.event_name != 'pull_request' || steps.filter.outputs.code == 'true'
        run: uv run --no-sync mypy --exclude tests/test_package src tests

      - name: Minimize uv cache
        if: ${{ !cancelled() && (github.event_name != 'pull_request' || steps.filter.outputs.code == 'true') }}
        run: uv cache prune --ci

  # Every hook in .pre-commit-config.yaml runs a tool from the project
  # environment, so pre-commit and the tools come from uv.lock and pre-commit
  # builds no environments of its own. The uv-lock hook runs this job's uv.
  # The checkout is shallow because nothing here needs a release version:
  # uv.lock records this project as a versionless editable root.
  pre-commit:
    runs-on: ubuntu-latest
    env:
      SKIP: "ruff"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --locked

      - name: Run pre-commit
        run: uv run --no-sync pre-commit run --show-diff-on-failure --color=always --all-files

      - name: Minimize uv cache
        if: ${{ !cancelled() }}
        run: uv cache prune --ci

  # Detect which areas changed so conditional jobs (docs, sandbox-tools-unit)
  # can be skipped. A skipped job-level `if` still reports a (non-blocking)
  # check, unlike workflow-level `paths-ignore` which would strand a
  # required check. That only holds for non-matrix jobs: a skipped matrix
  # job reports one check run under its unexpanded name, so required
  # contexts named for the expanded legs (`test (3.11)`, `test (3.14)`)
  # would never report. Docs-only detection for the test matrix therefore
  # lives inside the test job itself — see the comment there.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      sandbox_tools: ${{ steps.areas.outputs.sandbox_tools }}
      docs: ${{ steps.areas.outputs.docs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: areas
        with:
          filters: |
            sandbox_tools:
              - 'src/inspect_sandbox_tools/**'
            docs:
              - 'docs/**'
              - 'requirements-doc.txt'
              - 'uv.lock'

  # Validate the Quarto docs site whenever docs change — on docs-only PRs
  # (where the test matrix is skipped) and on mixed docs+code PRs alike.
  # Spell checking (typos, scoped to docs and markdown) already runs
  # unconditionally via the pre-commit job, so this job only needs to prove
  # the site renders. The site has `execute: enabled: false`, so rendering
  # is pure conversion: no code execution, no API keys.
  docs:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          filter: "blob:none"

      # The cache holds only a marker recording that this exact input set
      # rendered successfully, never the rendered site — nothing consumes
      # this job's output, so a stale hit can only skip a redundant
      # validation, not publish stale docs. The key covers everything the
      # render reads: the docs sources, the doc toolchain pins, and the
      # inspect_ai source that reference docs are generated from (griffe).
      # The marker is created only after a successful render and the cache
      # is saved only when the job succeeds, so a hit implies a past pass.
      #
      # The source component is this PR's own src/inspect_ai delta against
      # its merge base, not the checked-out tree. On pull_request the
      # checkout is the PR merged into current main, so hashing the tree
      # invalidated every open PR's entry on every push to main that touched
      # src/inspect_ai. The delta still forces a re-render when this PR edits
      # the source the reference docs are generated from. diff-tree lists
      # changed paths with blob ids, so it needs no blob fetches under the
      # blob:none checkout. The merge-base is quoted so a failure there fails
      # the step; an empty unquoted arg would leave the delta silently empty
      # (diff-tree prints nothing for a merge commit given one argument).
      # base_ref is empty on push and workflow_dispatch, so those use main.
      - name: Record this PR's own inspect_ai source delta
        run: git diff-tree -r "$(git merge-base origin/${{ github.base_ref || 'main' }} HEAD)" HEAD -- src/inspect_ai > .docs-src-delta

      - name: Check for previous successful render
        id: render-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .docs-render-ok
          key: docs-render-${{ hashFiles('docs/**', 'requirements-doc.txt', 'uv.lock', '.docs-src-delta') }}

      - name: Install uv
        if: steps.render-cache.outputs.cache-hit != 'true'
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.11"
          save-cache: false

      # The package itself is installed because reference docs are
      # generated from the inspect_ai module (griffe). The doc extra is
      # enough; the dev group isn't needed to render.
      - name: Install dependencies
        if: steps.render-cache.outputs.cache-hit != 'true'
        run: uv sync --locked --extra doc --no-default-groups

      - name: Render docs
        if: steps.render-cache.outputs.cache-hit != 'true'
        run: |-
          uv run --no-sync quarto render docs
          touch .docs-render-ok

      - name: Minimize uv cache
        if: ${{ !cancelled() && steps.render-cache.outputs.cache-hit != 'true' }}
        run: uv cache prune --ci

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
    strategy:
      matrix:
        python-version: ["3.11", "3.14"]

    steps:
      # Docs-only detection runs as a step rather than a `needs: changes`
      # job gate for two reasons. Latency: the job queues at run start
      # instead of behind a full queue+run cycle of the changes job
      # (~2.5 min median, ~8 min p90 of PR wall clock under runner
      # contention). Correctness: `test (3.11)` and `test (3.14)` are
      # required status checks under their expanded matrix names, and a
      # skipped matrix job reports a single check run under the unexpanded
      # name `test`, so a job-level `if` would leave the required contexts
      # unreported and block docs-only PRs forever. Gated no-op steps let
      # each leg report success under its required name in seconds.
      #
      # On pull_request the filter reads the diff from the API and needs no
      # checkout, so it runs first and docs-only PRs skip the checkout too.
      # On push it diffs the pushed commits and requires a checkout, hence
      # the split checkout steps. On workflow_dispatch there is no base to
      # diff against (paths-filter sees only the last commit), so manual
      # runs always do the full build.
      # 'every' is required for the negations to bite: the default 'some'
      # quantifier matches a file against ANY pattern, and '**' matches
      # everything, so `code` would be unconditionally true.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name != 'pull_request'
        with:
          fetch-depth: 0
          fetch-tags: true
          filter: "blob:none"
          submodules: true

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!docs/**'
              - '!design/**'
              - '!**/*.md'

      - name: Set RUN_TESTS
        run: echo "RUN_TESTS=${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.code == 'true' }}" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request' && env.RUN_TESTS == 'true'
        with:
          fetch-depth: 0
          fetch-tags: true
          filter: "blob:none"
          submodules: true

      - name: Install uv
        if: env.RUN_TESTS == 'true'
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ matrix.python-version }}

      # `uv sync` then `uv run --no-sync`, for the same reason as the mypy job.
      # The slow jobs run `uv run --locked` after `uv sync --locked`, which only
      # re-checks the lock.
      # tests/test_package goes in after the sync (it is not in the lockfile)
      # so ensure_test_package_installed() short-circuits instead of
      # pip-installing it mid-run (~9s on the xdist critical path, paid by
      # whichever test calls it first).
      - name: Install dependencies
        if: env.RUN_TESTS == 'true'
        run: |-
          uv sync --locked
          uv pip install --no-deps ./tests/test_package

      - name: Test with pytest
        if: env.RUN_TESTS == 'true'
        # --timeout (thread method) dumps a traceback and fails a hung test
        # rather than letting the job hang to the job-level timeout; this works
        # even through anyio cancel shields, which the conftest async timeout
        # cannot. The 900s budget sits above the conftest 300s per-test timeout
        # so it only fires on genuine hangs.
        # --durations feeds the recurring CI-performance analysis
        # (design/ci-perf/): per-test timings are mined from these logs.
        # --report-log records each test's worker and completion order, so a
        # failure caused by an earlier test on the same worker can be replayed
        # and bisected offline with scripts/pytest_bisect.py. Written
        # uncompressed: reportlog flushes every line, and flushing a .gz forces
        # a zlib flush per line (~4x the per-test cost). upload-artifact
        # compresses on upload anyway.
        # -n logical, not auto: auto means physical cores when psutil is
        # importable (it always is — a runtime dependency), using only 2 of
        # the runner's 4 vCPUs. Measured: 449s → 334s of pytest wall.
        run: uv run --no-sync pytest -ra --doctest-modules --color=yes -n logical --timeout=900 --timeout-method=thread --durations=50 --durations-min=1 --report-log=test-report-log.jsonl --report-log-exclude-logs-on-passed-tests

      - name: Upload test order log
        if: ${{ !cancelled() && env.RUN_TESTS == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-report-log-${{ matrix.python-version }}
          path: test-report-log.jsonl
          if-no-files-found: ignore
          retention-days: 14

      - name: Minimize uv cache
        if: ${{ !cancelled() && env.RUN_TESTS == 'true' }}
        run: uv cache prune --ci

  # Tests for the injected sandbox-tools package. These live under
  # src/inspect_sandbox_tools/ with the package's own pytest config and dev
  # dependencies; the root `test` job neither installs this package nor
  # collects its tests. Runs on any change to the package — including test-only
  # changes — and needs no Docker or built binary (unlike the
  # slow-tool-tests-* jobs below).
  sandbox-tools-unit:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.sandbox_tools == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.11"
          save-cache: false

      # inspect_sandbox_tools has its own dependencies, outside uv.lock, so
      # its tests run in their own venv from a hashed lock of the package's
      # dev extra (src/inspect_sandbox_tools/tests/requirements.txt; its
      # header is the command that regenerates it).
      - name: Install sandbox-tools package (with dev deps)
        run: |-
          uv venv
          uv pip sync --require-hashes src/inspect_sandbox_tools/tests/requirements.txt
          uv pip install --no-deps ./src/inspect_sandbox_tools

      - name: Test with pytest
        run: uv run --no-sync pytest src/inspect_sandbox_tools/tests/ -ra --color=yes

      - name: Minimize uv cache
        if: ${{ !cancelled() }}
        run: uv cache prune --ci

  # See design/sandbox-tools-ci-gates.md for the full gate matrix.

  detect-slow:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      tools_changed: ${{ steps.tools.outputs.tools }}
      injectable_src_changed: ${{ steps.injectable.outputs.injectable_src }}
      areas: ${{ steps.areas.outputs.changes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Special case: tools carries injectable-build/version/S3 baggage, so its
      # filters feed a dedicated chain (check-version-bump -> slow-tool-tests-*)
      # rather than the generic slow-tests matrix below.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: tools
        with:
          filters: |
            tools:
              - "src/inspect_ai/tool/**"
              - "src/inspect_sandbox_tools/**"
              - "tests/tools/**"
      # Separate step because the negation requires `every` semantics (a file
      # must match ALL patterns), which would break the OR-style filters above.
      # Keep the exclusions in sync with _check_main_divergence in
      # src/inspect_ai/tool/_sandbox_tools_utils/sandbox.py — the runtime uses
      # the same definition of "injectable source" to decide dev vs published.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: injectable
        with:
          predicate-quantifier: every
          filters: |
            injectable_src:
              - "src/inspect_sandbox_tools/**"
              - "!src/inspect_sandbox_tools/tests/**"
              - "!src/inspect_sandbox_tools/**/*.md"
              - "!src/inspect_sandbox_tools/design/**"
      # Generic, growable table of areas whose slow tests run with nothing but
      # `uv sync --locked` + Docker-on-the-runner. `changes` is a JSON list
      # of the keys that matched; the slow-tests matrix fans out over it.
      # Convention: each key is also the tests/<key>/ directory to run.
      # Tests needing an API key self-skip via skip_if_no_* (no secrets here),
      # so only add an area whose slow tests need no build artifact or secret.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: areas
        with:
          filters: |
            checkpoint:
              - "src/inspect_ai/util/_checkpoint/**"
              # tests/checkpoint/ exercises restore_repo against a real restic
              # binary, so restic-only changes must trigger the area too.
              - "src/inspect_ai/util/_restic/**"
              - "tests/checkpoint/**"

  # Fast gate: confirm sandbox_tools_version.txt is bumped above N (normally
  # N+1) when the injectable source changed. Blocks downstream slow jobs on
  # failure so PR contributors don't wait on a Docker build to learn they
  # forgot the bump.
  check-version-bump:
    needs: detect-slow
    if: needs.detect-slow.outputs.tools_changed == 'true'
    runs-on: ubuntu-latest
    outputs:
      version_correctly_bumped: ${{ steps.bump.outputs.correctly_bumped }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          filter: "blob:none"

      - name: Check version bump
        id: bump
        env:
          INJECTABLE_SRC_CHANGED: ${{ needs.detect-slow.outputs.injectable_src_changed }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          VERSION_PATH="src/inspect_ai/tool/_sandbox_tools_utils/sandbox_tools_version.txt"
          BASE_VERSION=$(git show "origin/${BASE_REF}:${VERSION_PATH}" | tr -d '[:space:]')
          # Read and validate the version the way upload_to_s3.py does: strip only
          # surrounding whitespace (not internal, so "3 7" can't pass as 37, which
          # the uploader's .strip() rejects), and require canonical digits before
          # the numeric compare below. The PR file is attacker-controlled on fork
          # PRs. Single-bracket test -gt doesn't run a[$(cmd)] (that's a [[ ]]/(( ))
          # behavior), but a non-canonical value still needs a clear, early
          # failure: it would break artifact naming (v+36) or, unbounded, overflow
          # the integer compare. The digit bound keeps it in range.
          PR_VERSION=$(< "${VERSION_PATH}")
          if ! [[ "$PR_VERSION" =~ ^[[:space:]]*([1-9][0-9]{0,8})[[:space:]]*$ ]]; then
            echo "::error::${VERSION_PATH} must be a positive integer of up to 9 digits, not v${PR_VERSION}."
            exit 1
          fi
          PR_VERSION=${BASH_REMATCH[1]}
          EXPECTED=$((BASE_VERSION + 1))
          echo "Base (${BASE_REF}): v${BASE_VERSION}; PR: v${PR_VERSION}; expected on bump: v${EXPECTED} or higher; injectable_src_changed=${INJECTABLE_SRC_CHANGED}"
          if [ "$INJECTABLE_SRC_CHANGED" = "true" ]; then
            # Any version above main, not only N+1. If a published version is
            # burned (its S3 bytes can no longer match the PR, because a build
            # input changed after upload), it can't be re-used (S3 objects are
            # immutable) and recovery is to bump past it. The version is only an
            # artifact label: gaps are harmless at runtime (sandbox.py reads it
            # to name the object to fetch), and provenance is proved by
            # slow-tool-tests-release, not by the number. Normally this is N+1.
            if [ "$PR_VERSION" -gt "$BASE_VERSION" ]; then
              echo "correctly_bumped=true" >> "$GITHUB_OUTPUT"
            else
              echo "::error::src/inspect_sandbox_tools/ changed but ${VERSION_PATH} is v${PR_VERSION}; bump it above v${BASE_VERSION} (normally v${EXPECTED})."
              exit 1
            fi
          else
            if [ "$PR_VERSION" = "$BASE_VERSION" ]; then
              # Unbumped direction of the digest-pinning rule: a SHA256SUMS-only
              # change is a re-publication of an existing version, which is
              # forbidden (published S3 objects are immutable). Applies only when
              # the sums file exists on the base ref so the PR that seeds the
              # file (no bump) doesn't fail the rule it introduces. The bumped
              # direction (sums must be rewritten) is deliberately enforced only
              # by slow-tool-tests-release: the sums are written at post-approval
              # upload, and a red fast gate here would block slow-tool-tests-dev
              # for the whole review window.
              SUMS_PATH="src/inspect_ai/tool/_sandbox_tools_utils/SHA256SUMS"
              if git cat-file -e "origin/${BASE_REF}:${SUMS_PATH}" 2>/dev/null && \
                 ! git diff --quiet "origin/${BASE_REF}" -- "${SUMS_PATH}"; then
                echo "::error::${SUMS_PATH} changed but ${VERSION_PATH} is unchanged. Digests for a published version are immutable; bump the version and publish fresh artifacts instead."
                exit 1
              fi
              echo "correctly_bumped=false" >> "$GITHUB_OUTPUT"
            else
              echo "::error::${VERSION_PATH} changed to v${PR_VERSION} but src/inspect_sandbox_tools/ is unchanged. Either revert the version change or include the injectable source change."
              exit 1
            fi
          fi

  # Developer gate: run the sandbox slow-test suite. When the injectable
  # source or version changed, build a -dev binary first; otherwise let
  # pytest resolve the published v{N} via the runtime's S3 download path.
  slow-tool-tests-dev:
    needs: [detect-slow, check-version-bump]
    if: needs.detect-slow.outputs.tools_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          filter: "blob:none"
          submodules: true

      - name: Create local main ref
        run: git branch main origin/main

      - name: Install uv
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.11"
          save-cache: false

      - name: Install dependencies
        run: uv sync --locked

      - name: Build sandbox-tools -dev binaries (glibc + musl)
        if: needs.detect-slow.outputs.injectable_src_changed == 'true' || needs.check-version-bump.outputs.version_correctly_bumped == 'true'
        env:
          DOCKER_BUILDKIT: 1
          BUILDKIT_PROGRESS: plain
        # Both libc variants: the slow suite includes an Alpine (musl) case.
        run: |
          uv run --locked python src/inspect_ai/tool/_sandbox_tools_utils/build_within_container.py --arch amd64
          uv run --locked python src/inspect_ai/tool/_sandbox_tools_utils/build_within_container.py --arch amd64 --musl

      - name: Run slow tool tests
        env:
          DOCKER_BUILDKIT: 1
          BUILDKIT_PROGRESS: plain
          # Compose 2.38's bake builder gives every project that builds the
          # same Dockerfile one image ID, so a parallel test's `docker rmi`
          # can delete it mid-build ("failed to get digest"). Drop once the
          # runner has Compose >= 2.39, together with the same setting in
          # meridianlabs-ai/actions inspect-ai-scheduled-tests.yml (actions#156).
          COMPOSE_BAKE: "false"
        run: uv run --locked pytest --runslow -m slow tests/tools/ -x -v --durations=0 -n logical

      - name: Minimize uv cache
        if: ${{ !cancelled() }}
        run: uv cache prune --ci

  # Release gate: runs only when the version was bumped. Verifies the bumped
  # version's artifacts are published to S3 (fails fast with a release-wizard
  # hint if not), then re-runs the slow tests against it. Maintainer reruns
  # from the Actions UI after uploading. Runs in parallel with
  # slow-tool-tests-dev: it consumes only the published S3 artifacts,
  # nothing the dev job produces.
  slow-tool-tests-release:
    needs: [detect-slow, check-version-bump]
    if: needs.detect-slow.outputs.tools_changed == 'true' && needs.check-version-bump.outputs.version_correctly_bumped == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # attestations/actions: read the build provenance and its run's title.
    permissions:
      contents: read
      attestations: read
      actions: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          filter: "blob:none"
          submodules: true

      - name: Install uv
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.11"

      # The project installs editable, so `_binaries_dir()` resolves to the
      # source tree the published binaries are downloaded into below.
      - name: Install dependencies
        run: uv sync --locked

      - name: Fetch and verify published non-dev sandbox-tools binaries
        run: |
          VERSION=$(tr -d '[:space:]' < src/inspect_ai/tool/_sandbox_tools_utils/sandbox_tools_version.txt)
          SUMS=src/inspect_ai/tool/_sandbox_tools_utils/SHA256SUMS
          mkdir -p src/inspect_ai/binaries
          # Digest file must be in lockstep with the version bump: four non-blank
          # entries, all named -v${VERSION}. (Entry format/distinctness is enforced
          # by a fast unit test.) A flag records the failure rather than an early
          # exit: `exit 1` in the awk body jumps to END, whose own exit would
          # override the status.
          if ! awk -v v="v${VERSION}" 'NF { n++; if ($2 !~ ("-" v "$")) bad = 1 } END { exit (bad || n != 4) }' "$SUMS"; then
            echo "::error::${SUMS} is not updated for v${VERSION}. Publish the CI-built artifacts with scripts/release-sandbox-tools.sh, which commits it (src/inspect_sandbox_tools/design/RELEASING.md)."
            exit 1
          fi
          # All four artifacts are fetched and digest-checked, not just the amd64
          # pair the slow tests exercise on this runner. Otherwise a crash partway
          # through upload_to_s3.py's upload order (amd64 first) would leave the
          # gate green with the arm64 objects missing, and the committed arm64
          # digests would never be compared against S3 by anything but the
          # maintainer-run round trip. The extra ~30 MB download is trivial in CI.
          for FILENAME in \
            "inspect-sandbox-tools-amd64-v${VERSION}" \
            "inspect-sandbox-tools-amd64-musl-v${VERSION}" \
            "inspect-sandbox-tools-arm64-v${VERSION}" \
            "inspect-sandbox-tools-arm64-musl-v${VERSION}"; do
            URL="https://inspect-sandbox-tools.s3.us-east-2.amazonaws.com/${FILENAME}"
            # Keep today's explicit not-yet-uploaded error (a bare curl -f 404 is
            # terse and carries no ::error annotation).
            if ! curl -fsI "$URL" >/dev/null; then
              echo "::error::Published binary ${FILENAME} not found at ${URL}. Publish the CI-built artifacts with scripts/release-sandbox-tools.sh (src/inspect_sandbox_tools/design/RELEASING.md), then rerun this job."
              exit 1
            fi
            curl -fSL -o "src/inspect_ai/binaries/${FILENAME}" "$URL"
            # Exactly-one-match assertion: without it, zero or duplicate entries
            # feed sha256sum a malformed line and its "no properly formatted
            # checksum lines" failure would be mislabeled a digest mismatch below.
            DIGEST=$(awk -v f="$FILENAME" '$2 == f { print $1; n++ } END { exit n != 1 }' "$SUMS") || {
              echo "::error::Expected exactly one ${SUMS} entry for ${FILENAME}; found none or duplicates (malformed sums file)."
              exit 1
            }
            echo "${DIGEST}  src/inspect_ai/binaries/${FILENAME}" | sha256sum -c - || {
              echo "::error::Digest mismatch for ${FILENAME}: the published S3 object does not match the digests committed in this PR. Do NOT re-upload over it. Investigate (wrong-checkout build, truncated upload, or tampering), and if the object is wrong, bump the version and publish fresh artifacts."
              exit 1
            }
            chmod +x "src/inspect_ai/binaries/${FILENAME}"
          done

      # The published bytes must come from a sandbox-tools-build.yml run on
      # main that succeeded (its attestation names the run, and the run title
      # names the commit it built), and that commit's build inputs must match
      # this PR's.
      # The built commit itself needn't land on main (squash merges), so its
      # build inputs are compared instead. A failure here comes after upload:
      # the published bytes are burned, so bump the version past the burned
      # number and publish fresh artifacts rather than re-uploading.
      # check-version-bump accepts any bump above main, so the skip is allowed.
      - name: Check published binaries were built in CI from this PR's code
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(tr -d '[:space:]' < src/inspect_ai/tool/_sandbox_tools_utils/sandbox_tools_version.txt)
          # Attestations exist only on the upstream repo (also when this runs in a fork).
          REPO=UKGovernmentBEIS/inspect_ai
          # Whole directories, not a file list: the build scripts run with their
          # own directory first on sys.path, so any file there can change the
          # bytes. binaries/ is gitignored, but a force-added file there would be
          # uploaded with the build's output. design/ and tests/ are outside
          # the package's src/, so the wheel never contains them.
          BUILD_INPUTS=(
            src/inspect_sandbox_tools
            ":(exclude)src/inspect_sandbox_tools/design"
            ":(exclude)src/inspect_sandbox_tools/tests"
            src/inspect_ai/tool/_sandbox_tools_utils
            ":(exclude)src/inspect_ai/tool/_sandbox_tools_utils/SHA256SUMS"
            src/inspect_ai/binaries
          )
          # The diff below compares a symlink's target path, not the target's
          # content, and the build follows symlinks; so allow none.
          if git ls-files -s -- "${BUILD_INPUTS[@]}" | awk '$1 == "120000" { print; found = 1 } END { exit !found }'; then
            echo "::error::Symlinks in the sandbox tools build inputs (above) aren't allowed: the build-input comparison can't see changes to their targets."
            exit 1
          fi
          for VARIANT in amd64 amd64-musl arm64 arm64-musl; do
            FILENAME="inspect-sandbox-tools-${VARIANT}-v${VERSION}"
            INVOCATION=$(gh attestation verify "src/inspect_ai/binaries/${FILENAME}" \
              --repo "$REPO" \
              --signer-workflow "$REPO/.github/workflows/sandbox-tools-build.yml" \
              --source-ref refs/heads/main --format json \
              --jq '.[0].verificationResult.statement.predicate.runDetails.metadata.invocationId') || {
              echo "::error::${FILENAME} on S3 has no valid attestation from sandbox-tools-build.yml on main. Release binaries must be built in CI (RELEASING.md step 3); bump the version and publish CI-built artifacts."
              exit 1
            }
            # Only a first attempt counts: a re-run's conclusion can come from a
            # different attempt than the one that signed these bytes.
            RUN_ID=$(sed -nE 's#.*/actions/runs/([0-9]+)/attempts/1$#\1#p' <<< "$INVOCATION")
            if [ -z "$RUN_ID" ]; then
              echo "::error::${FILENAME} wasn't signed by the first attempt of a run (invocationId: ${INVOCATION}). Publish artifacts from a fresh run."
              exit 1
            fi
            # Validation runs after signing, so only a successful run counts.
            CONCLUSION=$(gh run view "$RUN_ID" --repo "$REPO" --json conclusion --jq .conclusion)
            LATEST=$(gh run view "$RUN_ID" --repo "$REPO" --json attempt --jq .attempt)
            TITLE=$(gh run view "$RUN_ID" --repo "$REPO" --json displayTitle --jq .displayTitle)
            if [ "$CONCLUSION" != "success" ]; then
              echo "::error::${FILENAME} comes from run ${RUN_ID}, which did not succeed (${CONCLUSION:-in progress}); its validation may have failed."
              exit 1
            fi
            if [ "$LATEST" != "1" ]; then
              echo "::error::Run ${RUN_ID}, which built ${FILENAME}, was re-run (attempt ${LATEST}); only a run that succeeded on its first attempt counts. Publish artifacts from a fresh run."
              exit 1
            fi
            BUILT=${TITLE#Build sandbox tools at }
            if ! [[ "$BUILT" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::Can't read the built commit from run ${RUN_ID} (title: ${TITLE})."
              exit 1
            fi
            git fetch --quiet --no-tags origin "$BUILT"
            if ! git diff --quiet "$BUILT" HEAD -- "${BUILD_INPUTS[@]}"; then
              echo "::error::${FILENAME} was built from ${BUILT} (run ${RUN_ID}), whose build inputs differ from this PR:"
              git diff --stat "$BUILT" HEAD -- "${BUILD_INPUTS[@]}"
              echo "::error::Bump the version (past the burned one; any bump above main is accepted) and publish artifacts built at the PR's current head."
              exit 1
            fi
            echo "${FILENAME}: built in run ${RUN_ID} from ${BUILT}; build inputs match"
          done

      - name: Run slow tool tests against published artifact
        env:
          DOCKER_BUILDKIT: 1
          BUILDKIT_PROGRESS: plain
          # Force install-state=clean so _open_executable_for_arch resolves
          # the non-dev name; _check_main_divergence would otherwise return
          # "edited" on this PR (version.txt differs from main).
          INSPECT_SANDBOX_TOOLS_INSTALL_STATE: clean
          # Shared image IDs under Compose 2.38; see "Run slow tool tests".
          COMPOSE_BAKE: "false"
        run: uv run --locked pytest --runslow -m slow tests/tools/ -x -v --durations=0 -n logical

      - name: Minimize uv cache
        if: ${{ !cancelled() }}
        run: uv cache prune --ci

  # Generic per-area slow tests: one runner per changed area from the
  # detect-slow `areas` table. Add an area by adding a filter entry there;
  # no new job is needed. Runs plain `pytest --runslow` (no build artifact,
  # no secrets); API-key tests self-skip via skip_if_no_*.
  slow-tests:
    needs: detect-slow
    # An empty matrix vector errors, so skip the whole job when nothing matched.
    if: needs.detect-slow.outputs.areas != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        area: ${{ fromJSON(needs.detect-slow.outputs.areas) }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          filter: "blob:none"
          submodules: true

      - name: Install uv
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --locked

      - name: Run slow tests
        env:
          # Shared image IDs under Compose 2.38; see "Run slow tool tests".
          COMPOSE_BAKE: "false"
        run: uv run --locked pytest --runslow -m slow tests/${{ matrix.area }}/ -n logical --durations=0

      - name: Minimize uv cache
        if: ${{ !cancelled() }}
        run: uv cache prune --ci

  package:
    name: Build & inspect the package.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read

    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        if: github.event_name == 'pull_request'
        id: filter
        with:
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!docs/**'
              - '!design/**'
              - '!**/*.md'
            # pyproject.toml uses this file as package metadata.
            package_readme:
              - 'README.md'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name != 'pull_request' || steps.filter.outputs.code == 'true' || steps.filter.outputs.package_readme == 'true'
        with:
          fetch-depth: 0
          fetch-tags: true
          filter: "blob:none"

      - name: Install uv
        if: github.event_name != 'pull_request' || steps.filter.outputs.code == 'true' || steps.filter.outputs.package_readme == 'true'
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.11"

      # Build with the release's hash-pinned toolchain and no isolation, as
      # .github/actions/build-dist does, so nothing is resolved at build time.
      # --no-config: install the file as pip does there, without the project's
      # exclude-newer, which Dependabot's day-granular cooldown can undercut.
      - name: Build
        if: github.event_name != 'pull_request' || steps.filter.outputs.code == 'true' || steps.filter.outputs.package_readme == 'true'
        run: |
          uv venv "$RUNNER_TEMP/build-env"
          uv pip install --no-config --python "$RUNNER_TEMP/build-env" --require-hashes --only-binary :all: --no-deps -r scripts/build-dist/requirements.txt
          "$RUNNER_TEMP/build-env/bin/python" -m build --no-isolation
          ls -l dist

      # twine and check-wheel-contents come from uv.lock (the dist extra).
      - name: Install check tools
        if: github.event_name != 'pull_request' || steps.filter.outputs.code == 'true' || steps.filter.outputs.package_readme == 'true'
        run: uv sync --locked --no-default-groups --extra dist --no-install-project

      - name: Check wheel contents
        if: github.event_name != 'pull_request' || steps.filter.outputs.code == 'true' || steps.filter.outputs.package_readme == 'true'
        run: uv run --no-sync check-wheel-contents dist/*.whl

      - name: Check PyPI README
        if: github.event_name != 'pull_request' || steps.filter.outputs.code == 'true' || steps.filter.outputs.package_readme == 'true'
        run: uv run --no-sync twine check --strict dist/*

      - name: Minimize uv cache
        if: ${{ !cancelled() && (github.event_name != 'pull_request' || steps.filter.outputs.code == 'true' || steps.filter.outputs.package_readme == 'true') }}
        run: uv cache prune --ci
