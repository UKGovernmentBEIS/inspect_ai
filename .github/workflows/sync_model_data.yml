name: Sync Model Data

on:
  schedule:
    # Weekly on Monday at 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:

# The job that runs the script and its dependencies holds the provider keys
# but only a read-only token; the job that can push and open the PR holds no
# keys and installs nothing.
permissions: {}

jobs:
  generate:
    if: github.repository == 'UKGovernmentBEIS/inspect_ai'
    runs-on: ubuntu-latest
    # No Actions cache use, so the Actions cache refuses any write a malicious
    # package could attempt with the Actions cache token.
    cache-mode: none
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The script is self-contained (no inspect_ai imports), so sync just its
      # two committed dependencies into the uv cache (versions: locked with a
      # script lockfile) rather than the whole package; the run step below runs
      # the file. actions-cache none: this job holds API keys, so it restores
      # no cache (tests/test_workflow_cache.py).
      - name: Install Python dependencies
        uses: meridianlabs-ai/actions/install-python-dependencies@330f3df6492418d6b25dc2631fc31143489f4674 # main, 2026-11-02
        with:
          versions: locked
          python-version: "3.11"
          script: src/inspect_ai/model/_model_data/sync_models.py
          project-uv-settings: ignore
          actions-cache: none

      # The script's dependencies come from its committed lockfile (--locked
      # fails rather than re-resolving), since this step holds API keys. It
      # validates every source's credentials before fetching, so a missing key
      # fails before either file is written.
      - name: Sync model data
        env:
          TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
          FIREWORKS_API_KEY: ${{ secrets.FIREWORKS_API_KEY }}
        run: |
          uv run --no-config --locked --script \
            src/inspect_ai/model/_model_data/sync_models.py --source all

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: model-data
          path: |
            src/inspect_ai/model/_model_data/together.yml
            src/inspect_ai/model/_model_data/fireworks.yml
          if-no-files-found: error
          retention-days: 1

  open-pr:
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: model-data
          path: ${{ runner.temp }}/model-data

      # Copy only the two generated files; nothing else from the artifact
      # reaches the checkout.
      - name: Apply the generated files
        run: |
          for FILE in together.yml fireworks.yml; do
            cp "$RUNNER_TEMP/model-data/$FILE" "src/inspect_ai/model/_model_data/$FILE"
          done

      # The generated header embeds a run timestamp, so each file is dirty
      # after every run even when no model data changed; revert in that case
      # so no PR is opened.
      - name: Revert timestamp-only changes
        run: |
          for FILE in src/inspect_ai/model/_model_data/together.yml \
                      src/inspect_ai/model/_model_data/fireworks.yml; do
            if git diff -I '^# Auto-generated by sync_models.py' --quiet -- "$FILE"; then
              git checkout -- "$FILE"
            fi
          done

      - name: Create pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          add-paths: |
            src/inspect_ai/model/_model_data/together.yml
            src/inspect_ai/model/_model_data/fireworks.yml
          branch: sync-model-data
          delete-branch: true
          commit-message: "feat: update Fireworks and Together model info"
          title: "feat: update Fireworks and Together model info"
          body: |
            Automated update of `src/inspect_ai/model/_model_data/together.yml`
            and `src/inspect_ai/model/_model_data/fireworks.yml`, generated by
            `src/inspect_ai/model/_model_data/sync_models.py`.

            Opened by the [Sync Model Data workflow](https://github.com/${{ github.repository }}/actions/workflows/sync_model_data.yml).
