name: Publish to PyPI

on:
  release:
    types: [published]
  # Break-glass: run on the release tag (select it under "Use workflow from").
  # Unlike a release event, this may publish a tag that is not on main.
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type the selected release tag (e.g. 0.3.278) to confirm PyPI publication"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Builds without id-token so the build never holds publish credentials; the
  # publish job only uploads the verified artifacts.
  build:
    name: Build and verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # full history and tags for setuptools_scm and the main-ancestry
          # check; blob:none skips historical file contents
          fetch-depth: 0
          filter: "blob:none"
          persist-credentials: false

      - name: Check release tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          fail() { echo "::error::$1"; exit 1; }
          [ "$GITHUB_REF_TYPE" = "tag" ] ||
            fail "Publish must run on a release tag, not $GITHUB_REF_TYPE '$GITHUB_REF_NAME'"
          [[ "$GITHUB_REF_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] ||
            fail "Tag '$GITHUB_REF_NAME' is not a release version (X.Y.Z)"
          if [ "$EVENT_NAME" = "release" ]; then
            [ "$RELEASE_TAG" = "$GITHUB_REF_NAME" ] ||
              fail "Release tag '$RELEASE_TAG' does not match ref '$GITHUB_REF_NAME'"
            [ "$PRERELEASE" != "true" ] ||
              fail "Release $GITHUB_REF_NAME is marked pre-release; not publishing to PyPI"
            git merge-base --is-ancestor HEAD origin/main ||
              fail "Tag $GITHUB_REF_NAME is not on main; to publish it anyway, dispatch this workflow on the tag"
          else
            [ "$CONFIRM" = "$GITHUB_REF_NAME" ] ||
              fail "Confirmation '$CONFIRM' does not match the selected tag '$GITHUB_REF_NAME'"
          fi

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install build
        run: python -m pip install --upgrade build

      - name: Download and verify sandbox tools
        run: python scripts/pypi-release.py prepare

      - name: Build
        run: python -m build

      - name: Verify distributions
        run: python scripts/pypi-release.py verify-dist "$GITHUB_REF_NAME"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # trusted publishing
    environment:
      name: pypi
      url: https://pypi.org/p/inspect-ai
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
