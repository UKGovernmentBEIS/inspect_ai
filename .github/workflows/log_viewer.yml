name: Validate Embedded Viewer

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "*"

# Cancel superseded in-flight runs when a PR branch is updated; runs on
# main queue rather than cancel so every merge commit gets a full build.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  UV_VERSION: 0.9.4

jobs:
  # Keep the existing check names on Markdown-only PRs, but skip the viewer
  # checkout and toolchains. Pushes to main still run every check.
  check-schema-and-types:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        if: github.event_name == 'pull_request'
        id: filter
        with:
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!docs/**'
              - '!design/**'
              - '!**/*.md'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name != 'pull_request' || steps.filter.outputs.code == 'true'
        with:
          fetch-depth: 0
          fetch-tags: true
          # blob:none: all refs/commits for setuptools_scm, no historical
          # file contents (the full pack is ~400MB and fetch time is erratic)
          filter: "blob:none"
          submodules: recursive

      - name: Set up Python
        if: github.event_name != 'pull_request' || steps.filter.outputs.code == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.11

      - name: Install uv
        if: github.event_name != 'pull_request' || steps.filter.outputs.code == 'true'
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          version: "${{ env.UV_VERSION }}"

      - name: Install Python dependencies
        if: github.event_name != 'pull_request' || steps.filter.outputs.code == 'true'
        run: uv pip install --system .[dev]

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: github.event_name != 'pull_request' || steps.filter.outputs.code == 'true'
        with:
          package_json_file: src/inspect_ai/_view/ts-mono/package.json
      - name: Set up Node.js
        if: github.event_name != 'pull_request' || steps.filter.outputs.code == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.x"
          cache: pnpm
          cache-dependency-path: src/inspect_ai/_view/ts-mono/pnpm-lock.yaml
      - name: Install Node.js dependencies
        if: github.event_name != 'pull_request' || steps.filter.outputs.code == 'true'
        working-directory: src/inspect_ai/_view/ts-mono
        run: pnpm install --frozen-lockfile

      # The pipeline is Python → inspect-openapi.json → generated.ts. The two
      # arrows are checked independently: json → ts must match exactly, while
      # Python → json tolerates docstring-only ("description") drift so that
      # doc changes don't require regenerating checked-in artifacts. As a
      # result, description text in the committed artifacts can lag the Python
      # docstrings until the next structural change forces a regeneration.

      - name: Check generated types are in sync with checked-in schema
        if: github.event_name != 'pull_request' || steps.filter.outputs.code == 'true'
        working-directory: src/inspect_ai/_view/ts-mono
        run: |
          pnpm --filter @tsmono/inspect-common types:generate
          if ! git diff --exit-code -- packages/inspect-common/src/types/generated.ts
          then
            echo "generated.ts is out of sync with the committed inspect-openapi.json."
            echo "Regenerate both artifacts and commit them:"
            echo "  python src/inspect_ai/_view/schema.py"
            exit 1
          fi

      - name: Regenerate schema from Python source
        if: github.event_name != 'pull_request' || steps.filter.outputs.code == 'true'
        run: python src/inspect_ai/_view/schema.py

      - name: Check schema is up to date (docstring-only drift tolerated)
        if: github.event_name != 'pull_request' || steps.filter.outputs.code == 'true'
        run: python .github/scripts/check_openapi_drift.py

      - name: Ensure regeneration produced no other changes
        if: github.event_name != 'pull_request' || steps.filter.outputs.code == 'true'
        run: |
          if git status --porcelain \
              | grep -vE 'src/inspect_ai/_view/(inspect-openapi\.json|ts-mono)$' \
              | grep -q . \
            || git -C src/inspect_ai/_view/ts-mono status --porcelain \
              | grep -v 'packages/inspect-common/src/types/generated\.ts$' \
              | grep -q .
          then
            echo "Unexpected changes after regeneration:"
            git status
            git diff -- . ':!src/inspect_ai/_view/inspect-openapi.json'
            git -C src/inspect_ai/_view/ts-mono status
            git -C src/inspect_ai/_view/ts-mono diff -- . ':!packages/inspect-common/src/types/generated.ts'
            exit 1
          fi

  submodule-on-main:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        if: github.event_name == 'pull_request'
        id: filter
        with:
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!docs/**'
              - '!design/**'
              - '!**/*.md'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name != 'pull_request' || steps.filter.outputs.code == 'true'

      - name: Verify submodule commit is on ts-mono main
        if: github.event_name != 'pull_request' || steps.filter.outputs.code == 'true'
        run: |
          SUBMODULE_SHA=$(git ls-tree HEAD src/inspect_ai/_view/ts-mono | awk '{print $3}')
          echo "Submodule points to: $SUBMODULE_SHA"

          git fetch https://github.com/meridianlabs-ai/ts-mono.git main
          MAIN_SHA=$(git rev-parse FETCH_HEAD)
          echo "ts-mono main is at: $MAIN_SHA"

          if git merge-base --is-ancestor "$SUBMODULE_SHA" "$MAIN_SHA"; then
            echo "✓ Submodule commit is on ts-mono main"
          else
            echo "✗ Submodule commit $SUBMODULE_SHA is not on ts-mono main."
            echo "  Merge the submodule PR first, then update the pointer."
            exit 1
          fi

  # Runs the viewer test suite in the inspect_ai embedding. This includes the
  # fixture-driven timeline tests (packages/inspect-components), which consume
  # tests/timeline/fixtures/events/ from this repo and are skipped in ts-mono's
  # own standalone CI — without this job they run nowhere.
  viewer-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        if: github.event_name == 'pull_request'
        id: filter
        with:
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!docs/**'
              - '!design/**'
              - '!**/*.md'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name != 'pull_request' || steps.filter.outputs.code == 'true'
        with:
          submodules: true

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: github.event_name != 'pull_request' || steps.filter.outputs.code == 'true'
        with:
          package_json_file: src/inspect_ai/_view/ts-mono/package.json

      - name: Set up Node.js
        if: github.event_name != 'pull_request' || steps.filter.outputs.code == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.x"
          cache: pnpm
          cache-dependency-path: src/inspect_ai/_view/ts-mono/pnpm-lock.yaml

      - name: Install dependencies
        if: github.event_name != 'pull_request' || steps.filter.outputs.code == 'true'
        working-directory: src/inspect_ai/_view/ts-mono
        run: pnpm install --frozen-lockfile

      - name: Run inspect-components tests
        if: github.event_name != 'pull_request' || steps.filter.outputs.code == 'true'
        working-directory: src/inspect_ai/_view/ts-mono
        # The variable asserts that this repo's corpus is present, so the suite
        # fails rather than skipping if it can no longer find the fixtures.
        env:
          TSMONO_REQUIRE_FIXTURES: "1"
        run: pnpm --filter @tsmono/inspect-components test

  dist-validation:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        if: github.event_name == 'pull_request'
        id: filter
        with:
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!docs/**'
              - '!design/**'
              - '!**/*.md'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name != 'pull_request' || steps.filter.outputs.code == 'true'
        with:
          submodules: true

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: github.event_name != 'pull_request' || steps.filter.outputs.code == 'true'
        with:
          package_json_file: src/inspect_ai/_view/ts-mono/package.json

      - name: Set up Node.js
        if: github.event_name != 'pull_request' || steps.filter.outputs.code == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.x"
          cache: pnpm
          cache-dependency-path: src/inspect_ai/_view/ts-mono/pnpm-lock.yaml

      - name: Install dependencies
        if: github.event_name != 'pull_request' || steps.filter.outputs.code == 'true'
        working-directory: src/inspect_ai/_view/ts-mono
        run: pnpm install --frozen-lockfile

      - name: Build
        if: github.event_name != 'pull_request' || steps.filter.outputs.code == 'true'
        working-directory: src/inspect_ai/_view/ts-mono
        run: pnpm --filter @meridianlabs/log-viewer build

      - name: Check dist is up-to-date
        if: github.event_name != 'pull_request' || steps.filter.outputs.code == 'true'
        run: |
          if ! git diff --exit-code src/inspect_ai/_view/dist
          then
            echo "❌ dist/ is out of sync with the frontend source!"
            echo ""
            echo "The build output has changed. Run:"
            echo "  cd src/inspect_ai/_view/ts-mono"
            echo "  pnpm --filter @meridianlabs/log-viewer build"
            echo ""
            echo "Then commit the updated dist/ directory."
            exit 1
          fi
