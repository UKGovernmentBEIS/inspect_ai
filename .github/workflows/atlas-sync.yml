# Hourly Atlas sync — meridian-only (design: meridianlabs-ai/agents
# design/atlas-tracking.md → "The hourly Atlas sync").
#
# Task 1: discover open upstream PRs review-requested-to / assigned-to the
# reviewer from external contributors and seed proxy issues (External label,
# Stage=Review, Upstream PR field), auto-posting @review on each new proxy so
# the external review is running before a human opens it.
# Task 2: sync every open fork issue on Atlas that has an Upstream PR field —
# promotions follow the upstream reviewDecision tail; External proxies close
# on upstream merge/close, queue at Merge on maintainer approval, and return
# to Review on contributor response.
#
# Runs as the machine account: MARVIN_TOKEN needs the `project` scope to write
# the org board (preflight enforces this). Deterministic — no agent invocation.

name: Atlas sync

on:
  schedule:
    - cron: "17 * * * *" # hourly, off the top-of-hour rush
  workflow_dispatch:

concurrency:
  group: atlas-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    # A wedged run would otherwise hold the concurrency group for the 6-hour
    # default and silently skip the hourly syncs in between.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Classic PATs report scopes in the X-OAuth-Scopes header; fine-grained
      # ones don't, so fall back to an actual project read. Fail loudly either
      # way — without `project` scope every board write silently 403s.
      - name: Preflight - token can write the org project
        env:
          GH_TOKEN: ${{ secrets.MARVIN_TOKEN }}
        run: |
          set -euo pipefail
          [ -n "$GH_TOKEN" ] || { echo "::error::MARVIN_TOKEN is not set"; exit 1; }
          scopes=$(curl -sI -H "Authorization: token $GH_TOKEN" https://api.github.com/user \
                     | tr -d '\r' | sed -n 's/^[Xx]-[Oo][Aa]uth-[Ss]copes: //p')
          echo "token scopes: ${scopes:-<none reported>}"
          if [ -n "$scopes" ] && ! printf '%s' "$scopes" | grep -qE '(^|, )project(,|$)'; then
            echo "::error::MARVIN_TOKEN lacks the 'project' scope (has: $scopes)"; exit 1
          fi
          gh api graphql -f query='{node(id:"PVT_kwDOC7YMCM4BU68p"){... on ProjectV2{title}}}' \
            --jq '.data.node.title' >/dev/null \
            || { echo "::error::token cannot read the Atlas project"; exit 1; }

      - name: Sync
        env:
          GH_TOKEN: ${{ secrets.MARVIN_TOKEN }}
          REVIEWER: ransomr
        run: python3 .github/scripts/atlas_sync.py
