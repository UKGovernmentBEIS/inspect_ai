# Stale policy for PRs (see CONTRIBUTING.md): applies to every non-draft PR
# regardless of contributor tier — warn after 60 days of inactivity, close 7
# days later with a reopen invite. PRs created before start-date are
# grandfathered — the policy only applies going forward; the pre-existing
# open queue is dispositioned by hand.
# Issues are exempt entirely (days-before-issue-stale: -1) — issue backlog
# policy is the weekly triage session's job, not a bot's.
name: Stale PRs

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  pull-requests: write
  issues: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v11
        with:
          days-before-issue-stale: -1
          start-date: "2026-07-29T00:00:00Z"
          days-before-pr-stale: 60
          days-before-pr-close: 7
          stale-pr-label: stale
          exempt-draft-pr: true
          stale-pr-message: >-
            This PR has been inactive for 60 days. It will be closed in 7 days
            unless there's new activity — a comment or a push resets the clock.
            If you're waiting on a review from us, say so and we'll take a look.
          close-pr-message: >-
            Closing due to inactivity per our contribution policy. If you pick it back up, comment here or open
            a fresh PR referencing this one and we're happy to reopen.
          operations-per-run: 200
