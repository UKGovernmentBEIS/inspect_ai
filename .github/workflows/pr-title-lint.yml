name: PR Title Lint

# PRs are squash-merged, so the PR title becomes the commit on main that
# Release Please reads to decide the next version. The title must follow
# Conventional Commits (e.g. "fix: ...", "feat(eval): ...", "feat!: ..."),
# with the types in meridianlabs-ai/actions' conventional-commit-types.json.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  lint:
    permissions:
      pull-requests: read
    uses: meridianlabs-ai/actions/.github/workflows/pr-title-lint.yml@78e42fa47e62da0926f744f28602ffee11f6516b # main
