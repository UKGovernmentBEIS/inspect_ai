name: Build and Push Computer Tool Image to Docker Hub

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to assign to the image
        required: true
        type: string
        default: latest
      platforms:
        description: Target platforms (comma-separated list)
        required: true
        type: string
        default: linux/amd64,linux/arm64
      push:
        description: Push the image to Docker Hub
        required: true
        type: boolean
        default: true
      org:
        description: Docker Hub organization
        required: true
        type: string
        default: aisiuk

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: docker
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # This job holds the Docker Hub token, so it restores no cache
      # (tests/test_workflow_cache.py). Both setup actions otherwise restore
      # their image or binary from the Actions cache.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          image: docker.io/tonistiigi/binfmt:qemu-v10.2.3@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
          platforms: arm64,amd64
          cache-image: false
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          cache-binary: false
          driver-opts: image=docker.io/moby/buildkit:v0.35.0@sha256:aa632b921ef07411d2cb77292cd34213d4f7b384001d6fceef1e1f25bf9752bb
      # The digest pins on the binfmt and BuildKit images are what protect the
      # token: both run privileged. Logging in last also keeps the token out
      # of the Docker config while they start, and dry runs don't log in.
      - name: Login to DockerHub
        if: inputs.push
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and (optionally) push multi-arch image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: src/inspect_ai/tool/_tools/_computer/_resources
          push: ${{ github.event.inputs.push }}
          platforms: ${{ github.event.inputs.platforms }}
          tags: ${{ github.event.inputs.org }}/inspect-computer-tool:${{ github.event.inputs.tag }}
          # Release images are built from scratch: no layers are reused from
          # earlier builds and none are exported for later ones.
          no-cache: true
