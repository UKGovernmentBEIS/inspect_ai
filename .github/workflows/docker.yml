name: Build and Push Computer Tool Image to Docker Hub

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to assign to the image
        required: true
        type: string
        default: latest
      platforms:
        description: Target platforms (comma-separated list)
        required: true
        type: string
        default: linux/amd64,linux/arm64
      push:
        description: Push the image to Docker Hub
        required: true
        type: boolean
        default: true
      org:
        description: Docker Hub organization
        required: true
        type: string
        default: aisiuk

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: docker
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Login to DockerHub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # This job holds the Docker Hub token, so it restores no cache
      # (tests/test_workflow_cache.py). Both setup actions otherwise restore
      # their image or binary from the Actions cache.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64,amd64
          cache-image: false
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          cache-binary: false
      - name: Build and (optionally) push multi-arch image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: src/inspect_ai/tool/_tools/_computer/_resources
          push: ${{ github.event.inputs.push }}
          platforms: ${{ github.event.inputs.platforms }}
          tags: ${{ github.event.inputs.org }}/inspect-computer-tool:${{ github.event.inputs.tag }}
          # Release images are built from scratch: no layers are reused from
          # earlier builds and none are exported for later ones.
          no-cache: true
