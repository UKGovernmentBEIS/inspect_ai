# Claude stub for the meridianlabs-ai/inspect_ai fork.
# Lives on the `meridian` default branch. Claude branches from and opens PRs
# against pristine `main` (which mirrors UKGovernmentBEIS/inspect_ai) so review
# diffs never include meridian infra commits. See the two-stage PR flow in the
# README.
#
# Triggers are limited to issue_comment + issues on purpose: GitHub resolves
# those from the default branch (meridian, where this file lives), but it
# resolves pull_request-family events (pull_request_review_comment,
# pull_request_review) from the PR's own branches — which here are `main` / a
# `main`-cut feature branch, neither of which carries this workflow. So those
# events can NEVER fire on the fork; including them would only advertise a
# trigger that does nothing. Mention @claude in a TOP-LEVEL comment (or use the
# `claude` label) — inline review-comment replies are not picked up here.

name: Claude

# `issue_comment: edited` is included so that ADDING @claude/@auto to an
# existing comment (a common way people invoke the agent after the fact) fires
# the workflow — GitHub only delivers the edited action when it's subscribed
# here. The job `if:` below guards it to edits that newly introduce the phrase
# (via github.event.changes.body.from), so re-editing a comment that already
# mentioned the agent does NOT re-trigger it.
on:
  issue_comment:
    types: [created, edited]
  issues:
    types: [opened, labeled]

jobs:
  claude:
    # Cheap gate to avoid spending runner minutes on unrelated events; the
    # action does its own authoritative trigger check. Two phrases summon the
    # one-shot dev agent: @claude and @i-am-marvin (the machine account — a real
    # user, so the mention resolves to it and pings nothing else). They do the
    # same thing; the action's trigger_phrase is single-valued, so
    # `with.trigger_phrase` below resolves which phrase the *event's own text*
    # contains (comment body for a comment, issue body/title for an issue — the
    # same source the action checks) and this gate fires if that text has either.
    #
    # Machine-account guard: github.actor != 'i-am-marvin' over the whole gate,
    # so a comment/issue authored by the machine account can't self-trigger the
    # dev agent and loop (its own output — and the fork guidance below — can
    # contain @claude/@i-am-marvin). Hoisted rather than per-source: the sources
    # are OR'd, so guarding only the comment branch is bypassable by a phrase
    # left in the enclosing issue body/title.
    #
    # Sources are scoped to the event that carries them (github.event.action /
    # event_name), so a comment event is judged by the comment alone — a stale
    # @claude in the enclosing issue can't fire a runner-spin for an unrelated
    # comment, nor mask an alias typed in the comment.
    #
    # On an edited comment (the only `edited` action we subscribe to), fire only
    # when the edit newly introduced a phrase — comparing against the pre-edit
    # body — so re-editing a comment that already mentioned one does not
    # re-trigger. Known limitation: contains() is a substring test, looser than
    # the action's word-boundary trigger; a pre-edit body holding a phrase only
    # as a NON-triggering substring (in backticks, or a token like foo@claude)
    # blocks the edit path. Acceptable for a cheap gate (no regex in workflow
    # expressions); the action remains the authoritative check on what fires.
    # Bot guard: bot actors are never accepted by this workflow's agent (the
    # reusable workflow's allowed_bots is empty), but a bot comment QUOTING a
    # trigger phrase — e.g. the reviewer's summary advising an at-claude reply
    # — passed this gate and burned a checkout + provision before rejection
    # (and surfaced a ⚠️ when provisioning flaked). Skip bot actors outright;
    # marvin is a real user and is guarded separately.
    if: |
      github.actor != 'i-am-marvin' && !endsWith(github.actor, '[bot]') && (
        ( github.event.action == 'edited'
          && ( contains(github.event.comment.body, '@claude')
            || contains(github.event.comment.body, '@i-am-marvin') )
          && !( contains(github.event.changes.body.from, '@claude')
            || contains(github.event.changes.body.from, '@i-am-marvin') ) ) ||
        ( github.event.action == 'created' && (
            contains(github.event.comment.body, '@claude') ||
            contains(github.event.comment.body, '@i-am-marvin')
        ) ) ||
        ( github.event_name == 'issues' && (
            contains(github.event.issue.body, '@claude') ||
            contains(github.event.issue.body, '@i-am-marvin') ||
            contains(github.event.issue.title, '@claude') ||
            contains(github.event.issue.title, '@i-am-marvin') ||
            github.event.label.name == 'claude'
        ) )
      )
    uses: meridianlabs-ai/agents/.github/workflows/claude.yml@main
    # Pass the machine-account PAT (MARVIN_TOKEN, an org secret) explicitly —
    # not via `secrets: inherit` — so the fork's other secrets (e.g. SYNC_TOKEN)
    # aren't exposed to this @main-pinned workflow. Lets agent-opened fork PRs
    # trigger CI and @review. Absent secret resolves to empty; agent still runs.
    secrets:
      MARVIN_TOKEN: ${{ secrets.MARVIN_TOKEN }}
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    with:
      # trigger_phrase is single-valued, so resolve it from the SAME source the
      # action will check for this event (comment > issue), not from a union of
      # all sources — otherwise a stale @claude in an enclosing issue would mask
      # an @i-am-marvin typed in a comment, resolving @claude and then no-op'ing
      # (the action only checks the comment body on a comment event). Within a
      # source, default @claude and only switch to @i-am-marvin when that's
      # what's present; the trailing @claude covers the `claude` label event and
      # is a harmless fallback.
      # Caveat: this pick is substring-based (workflow expressions have no
      # regex), so it also SELECTS which phrase the action then re-checks with
      # word boundaries. In the contrived case where the other phrase appears
      # only as a NON-triggering substring (backticked, or glued into a token
      # like foo@i-am-marvin) a genuine trigger can be mis-resolved and no-op,
      # not merely cost gate minutes. Accepted: the collision needs someone to,
      # in one comment, write one phrase for real and the other as a bare
      # substring — and both phrases route to the same dev agent anyway.
      trigger_phrase: >-
        ${{
        github.event.comment && (contains(github.event.comment.body, '@i-am-marvin') && '@i-am-marvin' || '@claude') ||
        (contains(github.event.issue.body, '@i-am-marvin') || contains(github.event.issue.title, '@i-am-marvin')) && '@i-am-marvin' ||
        '@claude'
        }}
      base_branch: main
      # Fork has no PR-open auto-review; post @review from the reusable
      # post-step AFTER it applies the `auto` label (avoids the label/@review race).
      request_review_after_open: "true"
      # Fork-specific guidance. Goes through the reusable workflow's
      # append_system_prompt input (a single composed --append-system-prompt),
      # NOT claude_args — a second --append-system-prompt would collide with the
      # composed one. The fork can't ship a CLAUDE.md/AGENTS.md (main must stay
      # pristine and a file on meridian isn't on the main-cut work branches).
      # Anchored (&fork_prompt) so the @auto kickoff job below reuses the exact
      # same guidance — the two agents do the same fork work, and an anchor
      # keeps them from drifting apart.
      append_system_prompt: &fork_prompt >-
        Repo context: meridianlabs-ai/inspect_ai is a fork of
        UKGovernmentBEIS/inspect_ai (upstream). Branch `main` is a pristine
        mirror of upstream main: always branch from it and open PRs against it,
        never against the `meridian` branch, and never commit to `main` or
        `meridian` directly. Before opening a PR, verify your work per
        CLAUDE.md: install the project (pip install -e ".[dev]"), run pytest on
        the tests you added or touched, then ruff check and mypy on changed
        files; fix what they surface. If verification is impossible (a tool is
        blocked or the environment cannot be set up), state exactly what was not
        run in the PR description. When you finish implementing work from an
        issue, open a draft PR in this fork (base: main) with `gh pr create`
        rather than only linking a compare URL. In the PR description, reference
        the originating issue FULLY-QUALIFIED — write `Fixes
        meridianlabs-ai/inspect_ai#N`, never a bare `Fixes #N` (this includes
        the PR template's "Fixes #" line). A bare `#N` is repo-relative, so when
        a human promotes this work by opening an upstream PR from the same
        branch the reference silently rebinds to UKGovernmentBEIS/inspect_ai's
        issue #N — a different, unrelated issue; the fully-qualified form keeps
        it pointing at this fork's issue wherever the body is reused. PRs within this fork are a
        review surface only and are never merged here; finished work is promoted
        by a human opening an upstream PR from the same branch (gh pr create
        --repo UKGovernmentBEIS/inspect_ai --head meridianlabs-ai:BRANCH). When
        asked to address feedback from an upstream PR, read its comments with gh
        (upstream is public) and push fixes to the same branch in this fork; the
        upstream PR updates automatically. Never modify files under
        .github/workflows that are meridian-only (claude.yml, sync-upstream.yml).
        CHANGELOG: for changes to product functionality (not for test-only or
        build-only changes) add a CHANGELOG entry. Put it in the "## Unreleased"
        section at the top of the file; if that section does not exist, create
        it. If "## Unreleased" already has entries, group the new entry with
        similar items if any, otherwise add it at the end of the list. The entry
        must be a single line and a single sentence.
      # Appended to the shared branch_sync_prompt (not replacing it) — adds the
      # CHANGELOG-merge check, which is fork-specific since the CHANGELOG
      # convention is. Fires only on PR follow-up runs, where the merge happens.
      branch_sync_append: &fork_branch_sync >-
        If this branch added a CHANGELOG entry, review the merge result
        carefully: the default merge resolution can move your entry out of the
        "## Unreleased" section (e.g. under a released heading). After merging,
        always verify your CHANGELOG entry is still under "## Unreleased" and
        move it back if it was relocated.

  # @auto kickoff (distinct from the one-shot `claude` above). An `auto` label or
  # `@auto` mention drives the issue autonomously: the dev agent opens a PR, the
  # PR inherits the `auto` label (so the CI-fix loop in claude-auto.yml engages),
  # and it runs to a human handoff. Same reusable dev workflow, different trigger
  # — the action's trigger_phrase/label_trigger are single-valued, so `auto`
  # needs its own invocation. Needs MARVIN_TOKEN (the PR must trigger CI/@review).
  claude-auto:
    # See the `claude` job's `if:` — same edited-comment guard, so adding @auto
    # to an existing comment kicks off the autonomous loop but re-editing a
    # comment that already mentioned @auto does not re-fire it (which could
    # otherwise open a duplicate PR). Same machine-account guard too: @auto is
    # the loop-prone trigger, so keep the machine account from kicking it off
    # (nothing in the designed loop relies on marvin posting @auto).
    # Bot guard: bot actors are never accepted by this workflow's agent (the
    # reusable workflow's allowed_bots is empty), but a bot comment QUOTING a
    # trigger phrase — e.g. the reviewer's summary advising an at-claude reply
    # — passed this gate and burned a checkout + provision before rejection
    # (and surfaced a ⚠️ when provisioning flaked). Skip bot actors outright;
    # marvin is a real user and is guarded separately.
    if: |
      github.actor != 'i-am-marvin' && !endsWith(github.actor, '[bot]') && (
        ( github.event.action == 'edited'
          && contains(github.event.comment.body, '@auto')
          && !contains(github.event.changes.body.from, '@auto') ) ||
        ( github.event.action != 'edited' && (
            contains(github.event.comment.body, '@auto') ||
            contains(github.event.issue.body, '@auto') ||
            contains(github.event.issue.title, '@auto') ||
            github.event.label.name == 'auto'
        ) )
      )
    uses: meridianlabs-ai/agents/.github/workflows/claude.yml@main
    secrets:
      MARVIN_TOKEN: ${{ secrets.MARVIN_TOKEN }}
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    with:
      trigger_phrase: "@auto"
      label_trigger: "auto"
      base_branch: main
      # Fork has no PR-open auto-review; post @review from the reusable
      # post-step AFTER it applies the `auto` label (avoids the label/@review race).
      request_review_after_open: "true"
      # Same fork guidance as the `claude` job (reused via the YAML anchor).
      append_system_prompt: *fork_prompt
      branch_sync_append: *fork_branch_sync
