version: 2
updates:
  # Actions are pinned to commit SHAs with a `# vX.Y.Z` comment; Dependabot
  # bumps both. The cooldown gives a compromised release time to be caught
  # before it is proposed; security updates skip it.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"
  - package-ecosystem: pip
    versioning-strategy: lockfile-only
    directory: "/"
    schedule:
      interval: daily
      time: "13:00"
    groups:
      python-packages:
        patterns:
          - "*"
    ignore:
      - dependency-name: "quarto-cli"
        versions: [">=1.6.0"]
      - dependency-name: "ruff"
        versions: [">=0.9.5"]
      - dependency-name: "textual"
        versions: [">=2.0.0"]
      - dependency-name: "rich"
        versions: [">=14.0.0"]
      - dependency-name: "fsspec"
        versions: [">=2024.12.0"]
      - dependency-name: "click"
        versions: [">=8.2.0"]
      - dependency-name: "griffe"
        versions: [">=1.15.0"]
