version: 2
updates:
  # Actions are pinned to commit SHAs with a `# vX.Y.Z` comment; Dependabot
  # bumps both. The cooldown gives a compromised release time to be caught
  # before it is proposed; security updates skip it.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"
  # Bumps uv.lock. The cooldown matches `exclude-newer` in pyproject.toml,
  # and its exclude list matches `exclude-newer-package` there.
  - package-ecosystem: uv
    versioning-strategy: lockfile-only
    directory: "/"
    schedule:
      interval: daily
      time: "13:00"
    cooldown:
      default-days: 7
      exclude:
        - "aiobotocore"
        - "anthropic"
        - "aws-bedrock-token-generator"
        - "azure-ai-inference"
        - "boto3"
        - "botocore"
        - "google-genai"
        - "groq"
        - "huggingface-hub"
        - "inspect-scout"
        - "inspect-sentinel"
        - "mistralai"
        - "openai"
        - "together"
        - "xai-sdk"
    groups:
      python-packages:
        patterns:
          - "*"
    ignore:
      - dependency-name: "quarto-cli"
        versions: [">=1.6.0"]
      - dependency-name: "ruff"
        versions: [">=0.9.5"]
      - dependency-name: "textual"
        versions: [">=2.0.0"]
      - dependency-name: "rich"
        versions: [">=14.0.0"]
      - dependency-name: "fsspec"
        versions: [">=2024.12.0"]
      - dependency-name: "click"
        versions: [">=8.2.0"]
      - dependency-name: "griffe"
        versions: [">=1.15.0"]
