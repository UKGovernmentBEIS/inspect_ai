version: 2
updates:
  # Actions are pinned to commit SHAs with a `# vX.Y.Z` comment; Dependabot
  # bumps both. The cooldown gives a compromised release time to be caught
  # before it is proposed; security updates skip it.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"
  # Bumps uv.lock. The cooldown matches `exclude-newer` in pyproject.toml,
  # and its exclude list matches `exclude-newer-package` there: Dependabot's
  # cooldown counts whole days, so those packages' 6-hour cooldown is left to
  # uv. They get their own group, so a new SDK release is proposed the next day
  # and a broken update elsewhere can't hold it up. It comes first: a package
  # in both groups goes to the first match (and to the more specific pattern).
  - package-ecosystem: uv
    versioning-strategy: lockfile-only
    directory: "/"
    schedule:
      interval: daily
      time: "13:00"
    cooldown:
      default-days: 7
      exclude:
        - "anthropic"
        - "azure-ai-inference"
        - "google-genai"
        - "groq"
        - "inspect-scout"
        - "inspect-sentinel"
        - "mistralai"
        - "openai"
        - "together"
        - "xai-sdk"
    groups:
      provider-sdks:
        patterns:
          - "anthropic"
          - "azure-ai-inference"
          - "google-genai"
          - "groq"
          - "inspect-scout"
          - "inspect-sentinel"
          - "mistralai"
          - "openai"
          - "together"
          - "xai-sdk"
      python-packages:
        patterns:
          - "*"
    ignore:
      # Bumped by hand: a new ruff can reformat files across the repo.
      - dependency-name: "ruff"
      # together 3.x requires rich<15, so locking rich 15 downgrades together
      # to 2.x.
      - dependency-name: "rich"
        versions: [">=15.0.0"]
      # pyproject.toml caps fsspec at 2026.6.0. Raise this with the cap.
      - dependency-name: "fsspec"
        versions: [">2026.6.0"]
  # Bumps the release build toolchain pinned in
  # scripts/build-dist/requirements.txt.
  - package-ecosystem: uv
    directory: "/scripts/build-dist"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      build-toolchain:
        patterns:
          - "*"
