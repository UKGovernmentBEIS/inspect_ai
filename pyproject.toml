[build-system]
requires = ["setuptools>=64", "setuptools_scm[toml]>=9"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
# The base version for a checkout with no release tags, such as Dependabot's
# tagless shallow clone. Without it the project builds as 0.1.devN, below the
# inspect-ai floor of dev dependencies like inspect-scout, and `uv lock` fails.
# Release Please updates it with each release.
fallback_version = "0.3.286"
git_describe_command = [
  'git',
  'describe',
  '--dirty',
  '--tags',
  '--long',
  '--match',
  '[0-9]*.[0-9]*.[0-9]*',
]


[tool.setuptools.packages.find]
where = ["src"]
include = ["inspect_ai*"]

# Keep the ts-mono TS source out of the wheel: the git-tracked files are
# pruned in MANIFEST.in (include-package-data pulls the manifest into the
# wheel), while this exclude stops the package-data globs below (e.g.
# **/*.yml) from picking up untracked files inside ts-mono such as
# node_modules. The viewer ships prebuilt as _view/dist.
[tool.setuptools.exclude-package-data]
inspect_ai = ["_view/ts-mono*"]
# Docker image build inputs are not needed at runtime.
"inspect_ai.util._sandbox.docker" = ["Dockerfile*", "kali-archive-keyring.gpg"]

[tool.setuptools.package-data]
inspect_ai = [
    "binaries/*",
    "tool/_sandbox_tools_utils/sandbox_tools_version.txt",
    "tool/_sandbox_tools_utils/SHA256SUMS",
    "util/_restic/version.txt",
    "util/_restic/SHA256SUMS",
    "**/*.tcss",
    "**/*.yml",
    "_view/dist/**/*",
    "**/*.jsonl",
    "py.typed",
]


[tool.ruff]
extend-exclude = ["docs"]
src = ["src"]

[tool.ruff.lint]
select = [
  "E",      # pycodestyle errors
  "W",      # pycodestyle warnings
  "F",      # flake8
  "D",      # pydocstyle
  "I",      # isort
  "B",      # flake8-bugbear
  "SIM101", # duplicate isinstance
  # "RET", # flake8-return
  # "RUF", # ruff rules
  "DTZ",
  "TID251",  # banned-api
  "PLE",     # pylint errors
]
ignore = [
  "E203",
  "E501",
  "D10",
  "D212",
  "D415",
  "B006",
  "B007",
  "B008",
  "B009",
  "B010",
  "B011",
  "B017",
  "B027",
  "B028",
  "B039",
  "B904",
  "B905",
]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"typing.TypedDict".msg = "Use typing_extensions.TypedDict (Pydantic requires it on Python < 3.12)"
"typing.is_typeddict".msg = "Use typing_extensions.is_typeddict (typing.is_typeddict doesn't recognize typing_extensions.TypedDict subclasses)"

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
minversion = "7.0"
# --dist worksteal, not xdist's default load: load hands each worker a large
# contiguous slice of the collection up front, and collection is file-ordered,
# so cost clusters travel as a unit and one worker can end up holding the
# eval-set and _control integration files while its peers go idle. Measured on
# a 4-worker CI runner: 4 of 10 legs stranded 76-80s on a single worker.
# worksteal lets an idle worker take pending tests back off a straggler.
# No effect unless the run is distributed (-n); see design/ci-perf/report.md.
addopts = "-ra --doctest-modules --color=yes --dist worksteal"
testpaths = ["tests"]
doctest_optionflags = ["NORMALIZE_WHITESPACE", "IGNORE_EXCEPTION_DETAIL"]
norecursedirs = [
  "tests/test_helpers",
  "tests/test_package",
  "tests/test_task_list",
]
log_level = "WARNING"

[tool.mypy]
exclude = [
  "tests/test_package",
  "build",
  "(?:^|/)_resources/",
  "examples/bridge",
  "examples/evals_in_eval",
  "examples/hooks",
  "examples/http_proxy",
  "src/inspect_sandbox_tools",
]
warn_unused_ignores = true
no_implicit_reexport = true
strict_equality = true
enable_error_code = "possibly-undefined"
warn_redundant_casts = true
warn_unused_configs = true
# This mypy_path config is a bit odd, it's included to get mypy to resolve
# imports correctly in test files. For example, imports such as
# `from test_helpers.utils import ...` fail mypy without this configuration,
# despite actually working when running tests.
#
# Revisit this if it interferes with mypy running on `src`  due to name
# conflicts, but that will hopefully be unlikely.
mypy_path = "tests"

[[tool.mypy.overrides]]
module = ["inspect_ai.*"]
warn_return_any = true
disallow_untyped_defs = true
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
extra_checks = true
disable_error_code = "unused-ignore"

[tool.check-wheel-contents]
ignore = ["W002", "W009"]

[project]
name = "inspect_ai"
description = "Framework for large language model evaluations"
authors = [{ name = "UK AI Security Institute" }]
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT License" }
dynamic = ["version"]
dependencies = [
  "agent-client-protocol>=0.12.0",  # 0.12 renamed UntitledMultiSelectItems and added the ElicitationOtherPropertySchema catch-all
  "aiobotocore>=2.18.0",
  "anyio>=4.14.2",  # 4.14 fixes asyncio Lock/Semaphore waiter deadlock after cancellation (agronholm/anyio#1145); 4.14.2 adds Process._transport, used by run_subprocess to close pipes (agronholm/anyio#1166)
  "beautifulsoup4>=4.10.0",
  "boto3",
  "click>=8.1.3,!=8.2.0,!=8.2.2,!=8.3.0,!=8.3.1",  # 8.2.2/8.3.0/8.3.1 break optional flag values (pallets/click#3084, fixed in 8.3.2)
  "debugpy",
  "docstring-parser>=0.16",
  "fastapi>=0.119.0",
  "fsspec>=2023.1.0,<=2026.6.0",  # align with hf datasets to prevent pip errors
  "httpx",
  "ijson>=3.2.0",
  "jsonlines>=3.0.0",
  "jsonpatch>=1.32",
  "jsonpath-ng>=1.8.0",
  "jsonref>=1.1.0",
  "jsonschema>3.1.1",
  "markdown-it-py>=2.2.0",
  "mmh3>3.1.0",
  "nest_asyncio2>=1.7.4",
  "numpy",
  "platformdirs>=2.3.0",
  "psutil",
  "pydantic>=2.13.0",
  "python-dotenv>=0.16.0",
  "pyyaml",
  "rich>=13.3.3,!=14.0.0",
  "s3fs>=2023",
  "semver>=3.0.0",
  "shortuuid",
  "sniffio",
  "tenacity",
  "textual>=6.2.0",
  "tiktoken>=0.12.0",
  "typing_extensions>=4.14.0",
  "universal-pathlib>=0.2.6",
  "uvicorn",
  "zipfile-zstd>=0.0.4; python_version < '3.14'",
  "zipp>=3.19.1",  # not directly required, pinned by Snyk to avoid a vulnerability
  "zstandard>=0.20.0",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Natural Language :: English",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
  "Operating System :: OS Independent",
]

[project.optional-dependencies]
dev = [
  "adlfs>=2025.8.0",
  "anthropic>=2.0.0",
  "antlr4-python3-runtime>=4.9.3,<=4.13.2,!=4.10.*,!=4.12.*,!=4.13.0,!=4.13.1",
  "apprise",
  "aws-bedrock-token-generator",
  "azure-ai-inference",
  "azure-identity",
  "brotli",  # tests decode the agent bridge's forwarded Accept-Encoding: br; not a runtime dependency, since it makes httpx advertise br on every request
  "google-genai>=2.14.0",
  "griffe>=2",
  "groq>=0.28.0",
  "huggingface_hub>=1.6.0",
  "inspect-scout>=0.5.5",
  "inspect-sentinel>=0.3.0",
  "ipython",
  "jsonpath-ng",
  "latex2sympy2-extended==1.11.0",
  "markdown",
  "mcp>=1.10.0",
  "mistralai>=3.0.0",
  "moto[server]>=5.1.5",
  "mypy>=2.3.0",  # older mypy emits a `misc` error at a site where the ignore was removed as unused
  "nbformat",
  "openai>=3.4.0",
  "pandas>=2.0.0",
  "pandas-stubs",
  "panflute",
  "pip",
  # 4.4.0 adds `language: unsupported`, which .pre-commit-config.yaml uses
  "pre-commit>=4.4.0",
  # Hook tools run from this environment (.pre-commit-config.yaml)
  "pre-commit-hooks==4.5.0",
  "pyarrow>=10.0.1",
  "pyarrow-stubs",
  "pytest",
  "pytest-cov",
  "pytest-dotenv",
  "pytest-mock",
  # --report-log records per-worker test order for scripts/pytest_bisect.py
  "pytest-reportlog",
  "pytest-textual-snapshot",
  "pytest-timeout",
  "pytest-watcher",
  "pytest-xdist",
  "ruff==0.9.6",
  "textual-dev>=0.86.2",
  "together>=2.0.0",
  "trio",
  "trustme",
  "types-aiobotocore",
  "types-beautifulsoup4",
  "types-boto3",
  "types-botocore",
  "types-grpcio",
  "types-jsonpatch",
  "types-jsonschema",
  "types-Markdown",
  "types-protobuf",
  "types-psutil",
  "types-python-dateutil",
  "types-PyYAML",
  "types-regex",
  "typos==1.31.2",
  "xai_sdk>=1.18.0",
  # zipfile-zstd patches zipfile to support zstd compression (for creating test fixtures)
  "zipfile-zstd>=0.0.4; python_version < '3.14'",
]
doc = [
  "click>=8.2.0",
  "griffe>=2",
  "jupyter",
  "markdown",
  "nbclient",
  "panflute",
  "pyyaml",
  "quarto-cli>=1.9.36",
  "types-PyYAML",
]
dist = [
  "build",
  "check-wheel-contents",
  "twine",
]
math = [
  "antlr4-python3-runtime>=4.9.3,<=4.13.2,!=4.10.*,!=4.12.*,!=4.13.0,!=4.13.1",
  "latex2sympy2-extended==1.11.0",
]

[project.urls]
Documentation = "https://inspect.aisi.org.uk/"
"Source Code" = "https://github.com/UKGovernmentBEIS/inspect_ai"
"Issue Tracker" = "https://github.com/UKGovernmentBEIS/inspect_ai/issues"

[project.scripts]
inspect = "inspect_ai._cli.main:main"

[tool.typos.default.extend-words]
ba = "ba"
ser = "ser"
lsat = "lsat"
aimd = "aimd"
retuned = "retuned"
BRE = "BRE"

[dependency-groups]
dev = ["inspect_ai[dev]"]

[tool.uv]
cache-keys = [{ git = { commit = true } }, { file = "pyproject.toml" }]
default-groups = ["dev"]
# 0.11.8 is the first uv that keeps uv.lock stable with a relative exclude-newer.
required-version = ">=0.11.8"
# Only resolve releases at least 7 days old (see CONTRIBUTING.md).
exclude-newer = "7 days"

# A 6-hour cooldown instead, so a new release can be adopted the day it ships:
# each model provider's own SDK or integration package (and the AWS SDKs
# Bedrock and SageMaker use), but not infrastructure such as torch; Inspect's
# own packages, which are released together with inspect_ai; and the CA
# bundle (certifi), whose releases usually remove compromised roots.
[tool.uv.exclude-newer-package]
aiobotocore = "6 hours"
anthropic = "6 hours"
aws-bedrock-token-generator = "6 hours"
azure-ai-inference = "6 hours"
boto3 = "6 hours"
botocore = "6 hours"
certifi = "6 hours"
google-genai = "6 hours"
groq = "6 hours"
huggingface-hub = "6 hours"
inspect-scout = "6 hours"
inspect-sentinel = "6 hours"
mistralai = "6 hours"
nnterp = "6 hours"
openai = "6 hours"
sglang = "6 hours"
together = "6 hours"
transformer-lens = "6 hours"
transformers = "6 hours"
vllm = "6 hours"
xai-sdk = "6 hours"
